<title>Todnet</title>
<link rel="icon" href="icon.ico">
<!--
  Paint the right theme before the first frame. The authoritative theme lives
  in settings.json; this cached copy only prevents a flash of the wrong surface
  while /api/state is in flight.

  The language is cached the same way, and it also carries the writing
  direction: an interface that starts left-to-right and then flips is worse
  than one that starts in the right direction.
-->
<script>
(function () {
  try {
    var mode = localStorage.getItem('todnet.theme') ||
      localStorage.getItem('foxy.theme') || 'system';
    var light = mode === 'light' || (mode === 'system' &&
      window.matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
  } catch (e) {
    document.documentElement.dataset.theme = 'dark';
  }
  try {
    var lang = localStorage.getItem('todnet.lang') ||
      localStorage.getItem('foxy.lang') || 'en';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  } catch (e) {
    document.documentElement.dir = 'ltr';
  }
})();
</script>

<!-- Loaded last: the right-to-left rules have to win over the ones they

<link rel="stylesheet" href="css/direction.css">

<div class="titlebar" id="titlebar">
  <div class="titlebar-state" id="titlebarState">
    <span class="titlebar-dot" id="titlebarDot" data-tone="idle" aria-hidden="true"></span>
    <span class="titlebar-state-text" id="titlebarStateText"></span>
  </div>
  <div class="titlebar-buttons">
    <button class="tb-btn" id="tbMin" type="button" aria-label="Minimise" title="Minimise" data-i18n-label="window.minimize" data-i18n-title="window.minimize">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tb-min"/></svg>
    </button>
    <button class="tb-btn" id="tbMax" type="button" aria-label="Maximise" title="Maximise" data-i18n-label="window.maximize" data-i18n-title="window.maximize">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tb-max"/></svg>
    </button>
    <button class="tb-btn is-close" id="tbClose" type="button" aria-label="Close" title="Close" data-i18n-label="window.close" data-i18n-title="window.close">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tb-close"/></svg>
    </button>
  </div>
</div>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark" id="brandMark"><svg aria-hidden="true"><use href="#i-fox"/></svg></span>
      <span class="brand-word">Todnet</span>
    </div>

    <nav class="nav" id="nav" aria-label="Main" data-i18n-label="nav.main">
      <span class="nav-pill no-anim" id="navPill" aria-hidden="true"></span>
      <button class="nav-item" data-view="home" data-i18n-title="nav.home" data-shortcut="1">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-home"/></svg><span data-i18n="nav.home">Home</span>
      </button>
      <button class="nav-item" data-view="locations" data-i18n-title="nav.locations" data-shortcut="2">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-pin"/></svg><span data-i18n="nav.locations">Locations</span>
      </button>
      <button class="nav-item" data-view="settings" data-i18n-title="nav.settings" data-shortcut="3">
        <svg class="nav-icon nav-icon-gear" aria-hidden="true"><use href="#i-gear"/></svg><span data-i18n="nav.settings">Settings</span>
      </button>
      <button class="nav-item" data-view="logs" data-i18n-title="nav.logs" data-shortcut="4">
        <svg class="nav-icon nav-icon-doc" aria-hidden="true"><use href="#i-doc"/></svg><span data-i18n="nav.logs">Logs</span>
      </button>
    </nav>

    <div class="rail-foot">
      <button class="account-card" id="accountBtn" aria-haspopup="dialog" aria-expanded="false" title="Account">
        <span class="avatar" id="accountAvatar" aria-hidden="true"><svg aria-hidden="true"><use href="#i-user"/></svg></span>
        <span class="account-meta">
          <span class="account-mail truncate" id="accountMail">Sign in</span>
          <span class="account-sub"><span id="accountSub">Firefox account</span></span>
        </span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="banner-host" id="bannerHost"></div>
    <div class="view-host" id="viewHost"></div>
  </main>
</div>

<div id="layerHost"></div>
<div class="toast-host" id="toastHost" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="liveStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
