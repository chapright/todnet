<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="foxmark-title">
  <title id="foxmark-title">Todnet fox mark</title>
  <!-- The small-size sibling of fox-head.svg. Same animal, same silhouette
       logic, but reduced to a single filled shape with the eyes and nose cut
       out: at 16-32px a rendered illustration collapses into mud, and only a
       filled or outlined mark stays legible.
       What separates a fox from a cat here is the proportion, not the
       detail: tall forward-set ears, a ruff that flares out at the cheeks,
       and a snout that tapers to a point instead of a round jaw. -->
